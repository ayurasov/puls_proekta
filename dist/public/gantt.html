<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пульс Проекта (©AlexYurasov)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root,[data-theme=light]{--bg:#f4f4f2;--surface:#fff;--surface2:#fafaf9;--off:#f0efed;--border:#dfddd8;--divider:#eceae6;--text:#1d1b18;--muted:#736f67;--primary:#2563eb;--primary2:#dbeafe;--warn:#c0841a;--danger:#dc2626;--shadow:0 10px 28px rgba(0,0,0,.08);--side-width:450px}
[data-theme=dark]{--bg:#121211;--surface:#1a1918;--surface2:#1f1e1c;--off:#242320;--border:#2e2d2a;--divider:#2a2926;--text:#d6d3ce;--muted:#8a857d;--primary:#4f8dfd;--primary2:#1d2f4e;--warn:#d4a13a;--danger:#f87171;--shadow:0 12px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--side-width) 1fr;grid-template-rows:48px auto 1fr;height:100vh}.app.side-hidden{grid-template-columns:0 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border);z-index:60}
.logo{font-weight:800;font-size:13px;color:var(--primary);white-space:nowrap}.sp{flex:1}
.themeBtn{border:none;background:none;font-size:18px;padding:4px 6px;cursor:pointer;border-radius:6px;line-height:1;color:var(--muted)}.themeBtn:hover{background:var(--off);color:var(--text)}
.dropMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:var(--shadow);min-width:160px}.dropMenu .btn{display:block;width:100%;text-align:left;margin-bottom:2px}
.tabBar{grid-column:1/-1;display:flex;align-items:center;gap:0;padding:0 12px;background:var(--surface2);border-bottom:1px solid var(--border);overflow-x:auto;min-height:34px;z-index:59}
.tabBar::-webkit-scrollbar{height:3px}.tabBar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{display:flex;align-items:center;gap:4px;padding:5px 12px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text);background:var(--off)}.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--surface)}
.tab .tabClose{margin-left:4px;font-size:14px;line-height:1;opacity:.5;border:none;background:none;padding:0 2px;color:inherit;cursor:pointer}.tab .tabClose:hover{opacity:1;color:var(--danger)}
.tabAdd{border:none;background:none;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;border-radius:4px}.tabAdd:hover{background:var(--off);color:var(--text)}
.side{background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:10px;position:relative}
.sideToggleInner{position:absolute;top:18px;right:10px;z-index:5;width:28px;height:28px;border:none;background:var(--off);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease}.sideToggleInner:hover{background:var(--primary);transform:scale(1.08)}.sideToggleInner.collapsed{transform:rotate(180deg)}
.sideToggleInner svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:.2s}.sideToggleInner:hover svg{stroke:#fff}
.panelReveal{position:fixed;left:10px;top:118px;z-index:55;display:none;width:28px;height:28px;border:none;background:var(--off);border-radius:8px;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease}.panelReveal:hover{background:var(--primary);transform:scale(1.08)}
.panelReveal svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.panelReveal:hover svg{stroke:var(--text)}
.app.side-hidden .panelReveal{display:flex}.app.side-hidden .main{grid-column:1/-1}.app.side-hidden .side{display:none}
.sideResizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.section{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface2)}
.section h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--divider);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;font-weight:700}
.section h3 .collapseIcon{font-size:12px;opacity:.6;transition:.15s}.section h3 .collapseIcon:hover{opacity:1}
.section .sectionBody{overflow:hidden;transition:max-height .2s ease}
.pad{padding:10px 12px}.col{display:flex;flex-direction:column;gap:6px}.row{display:flex;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:11px;color:var(--muted);font-weight:700}
.inp,.sel,.txt{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px}
.txt{min-height:64px;resize:vertical}
.btn{border:1px solid var(--border);background:var(--off);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.d{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12px;cursor:pointer}.chip.on{background:var(--primary2);color:var(--primary);border-color:var(--primary)}
.colors{display:flex;flex-wrap:wrap;gap:5px}.sw{width:18px;height:18px;border-radius:5px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--text)}
.list{display:flex;flex-direction:column;gap:4px}.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:box-shadow .15s}.item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}.grow{flex:1;min-width:0}.mut{font-size:11px;color:var(--muted)}.tiny{font-size:11px}
.meta{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.title{font-size:16px;font-weight:800}.subtitle{font-size:12px;color:var(--muted)}
.filterBar{display:flex;gap:6px;align-items:center;font-size:12px}.filterBar select{padding:4px 8px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.outer{height:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;margin:8px 14px;box-shadow:var(--shadow)}.scroll{flex:1;overflow:auto;position:relative}
.ghead,.growr{display:flex;min-width:max-content}.stickyTop{position:sticky;top:0;z-index:30}
.leftHead,.leftCell{position:sticky;left:0;z-index:15;background:var(--surface);border-right:1px solid var(--border)}
.leftHead{z-index:31;background:var(--off);padding:8px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;align-items:center}
.leftCell{padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.ganttColResizer{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:32;right:0}.ganttColResizer:hover,.ganttColResizer.active{background:var(--primary);opacity:.3}
.timelineHead{display:flex;background:var(--off);border-bottom:2px solid var(--border)}
.monthCell,.scaleCell{border-right:1px solid var(--divider);text-align:center;flex-shrink:0;color:var(--muted);font-size:10px;font-weight:700}
.monthCell{padding:6px 3px}.scaleCell{padding:3px 1px}
.scaleCell.weekend{background:rgba(120,120,120,.08)}.scaleCell.holiday{background:rgba(239,68,68,.10)}.scaleCell.today{background:var(--primary2);color:var(--primary)}
.barArea{position:relative;flex-shrink:0}.rowLine{border-bottom:1px solid var(--divider)}.rowAlt{background:var(--surface2)}.groupRow .leftCell{font-weight:800}
.gridLine{position:absolute;top:0;bottom:0;width:1px;background:var(--divider)}
.weekendShade{position:absolute;top:0;bottom:0;background:rgba(127,127,127,.06)}
.holidayShade{position:absolute;top:0;bottom:0;background:rgba(239,68,68,.07)}
.todayLine{position:absolute;top:0;bottom:0;width:2px;z-index:8;pointer-events:none}.jiraBtn{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;box-shadow:0 1px 2px rgba(0,0,0,.2)}.jiraBtn svg{width:10px;height:10px}
.milestoneLine{position:absolute;top:0;bottom:0;width:2px;z-index:7;pointer-events:none;cursor:pointer}
.milestoneLabel{position:absolute;top:2px;font-size:9px;font-weight:700;white-space:nowrap;pointer-events:none;z-index:9;transform:translateX(-50%)}
.taskWrap{position:absolute;top:50%;transform:translateY(-50%);height:24px;z-index:10}
.taskbar{position:absolute;inset:0;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:grab}.taskbar:active{cursor:grabbing}
.handle{position:absolute;top:0;bottom:0;width:8px;z-index:12}.handle.left{left:-1px;cursor:ew-resize}.handle.right{right:-1px;cursor:ew-resize}
.prog{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.25}
.offsetBar{position:absolute;top:0;bottom:0;border-radius:6px;opacity:.55;pointer-events:auto;cursor:default;background-image:repeating-linear-gradient(135deg,transparent,transparent 3px,rgba(255,255,255,.25) 3px,rgba(255,255,255,.25) 6px);display:flex;align-items:center;padding:0 4px;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.groupBarWrap{position:absolute;top:50%;transform:translateY(-50%);height:12px;z-index:9;pointer-events:none}
.groupBar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;opacity:.45;cursor:pointer;pointer-events:auto}
.groupBar::before,.groupBar::after{content:'';position:absolute;bottom:0;width:3px;height:100%;background:inherit;border-radius:2px;opacity:1}
.groupBar::before{left:0;border-radius:3px 0 0 3px}.groupBar::after{right:0;border-radius:0 3px 3px 0}
.groupBarLabel{position:absolute;top:-13px;left:0;font-size:9px;font-weight:700;white-space:nowrap;pointer-events:none;color:var(--muted)}
.groupOffsetBar{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.4;pointer-events:none;background-image:repeating-linear-gradient(135deg,transparent,transparent 2px,rgba(255,255,255,.3) 2px,rgba(255,255,255,.3) 4px);display:flex;align-items:center;padding:0 3px;font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.groupBarText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;pointer-events:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.noteGroup{position:absolute;z-index:11;display:flex;align-items:flex-start;gap:3px;top:1px;transform:translateX(-7px);cursor:pointer}
.notePin{width:14px;height:20px;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.noteText{font-size:9px;font-weight:600;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;margin-top:3px}
.noteDeleteBtn{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;cursor:pointer;opacity:0;transition:.15s;color:var(--danger);flex-shrink:0;margin-top:2px}
.noteGroup:hover .noteDeleteBtn{opacity:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border)}.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.sq{width:14px;height:8px;border-radius:2px}.dm{width:8px;height:8px;transform:rotate(45deg)}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}.modalBg.on{display:flex}
.modal{width:min(820px,96vw);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--divider)}
.bd{padding:16px 18px}.ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--divider)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:300}
.menu{display:flex;gap:6px}
.collapse{width:16px;height:16px;border:1px solid var(--border);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:var(--off);cursor:pointer;flex-shrink:0}
.rowDropTarget{outline:2px solid var(--primary);outline-offset:-2px}
.rowDragHandle{cursor:grab;opacity:.3;font-size:12px;user-select:none;flex-shrink:0;letter-spacing:-2px}.rowDragHandle:hover{opacity:.7}
.drop-indicator{position:absolute;left:0;right:0;height:2px;background:var(--primary);z-index:50;pointer-events:none;border-radius:1px;transition:top .05s}.drop-indicator::before{content:'';position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.rowLine{position:relative}.rowLine.drag-above{border-top:2px solid var(--primary)}.rowLine.drag-below{border-bottom:2px solid var(--primary)}.rowLine.drag-into{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.zoomInput{width:56px;text-align:center;padding:4px 2px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
@media(max-width:1100px){.app{grid-template-columns:1fr}.side{display:none}}

/* Status colors */
.status-new{color:var(--primary);font-weight:600}
.status-inwork{color:#f59e0b;font-weight:600}
.status-blocked{color:var(--danger);font-weight:600}
.status-done{color:#22c55e;font-weight:600}
/* Task bar done overlay */
.taskbar.done{opacity:.75;outline:2.5px solid #22c55e;outline-offset:-1px}
.taskbar.done::after{content:'✓';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:11px;color:#22c55e;font-weight:800}
.taskbar.blocked{outline:2px dashed var(--danger);outline-offset:-1px;opacity:.7}
/* Improved task row in sidebar */
.item .edit-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface2);transition:all .15s;flex-shrink:0;cursor:pointer;color:var(--muted);font-size:13px}
.item .edit-icon:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.08)}
.item .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid transparent}
.item .status-dot.st-new{background:var(--primary);border-color:var(--primary)}
.item .status-dot.st-inwork{background:#f59e0b;border-color:#f59e0b}
.item .status-dot.st-blocked{background:var(--danger);border-color:var(--danger)}
.item .status-dot.st-done{background:#22c55e;border-color:#22c55e}
/* Left cell improved */
.leftCell .task-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:1.4}
.leftCell .task-meta-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--muted);line-height:1.3}
.leftCell .edit-cell-btn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface2);transition:all .15s;flex-shrink:0;cursor:pointer;color:var(--muted);font-size:12px;opacity:.5}
.leftCell:hover .edit-cell-btn{opacity:1}
.leftCell .edit-cell-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Context menu */
.ctxMenu{position:fixed;z-index:250;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow);min-width:200px}
.ctxMenu .ctx-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:12px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--text);transition:.1s}
.ctxMenu .ctx-item:hover{background:var(--off)}
.ctxMenu .ctx-item .ctx-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ctxMenu .ctx-sep{height:1px;background:var(--divider);margin:3px 8px}
/* Tooltip */
.gantt-tooltip{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;pointer-events:none;max-width:320px;transition:opacity .1s}
.gantt-tooltip .tt-title{font-weight:700;margin-bottom:4px;font-size:13px}
.gantt-tooltip .tt-row{display:flex;gap:6px;align-items:center;padding:2px 0;color:var(--muted)}
.gantt-tooltip .tt-row b{color:var(--text);font-weight:600}
/* Task hover highlight */
.taskWrap:hover .taskbar{filter:brightness(1.08);box-shadow:0 2px 12px rgba(0,0,0,.18)}
/* Comments panel */
.comment-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding:4px 0}
.comment-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px}
.comment-item.reply{margin-left:24px;border-left:2px solid var(--primary)}
.comment-meta{font-size:10px;color:var(--muted);margin-bottom:3px}
.comment-text{white-space:pre-wrap;word-break:break-word}
/* History panel */
.history-list{display:flex;flex-direction:column;gap:4px;max-height:250px;overflow:auto}
.history-item{display:flex;gap:8px;align-items:flex-start;font-size:11px;padding:4px 0;border-bottom:1px solid var(--divider)}
.history-item .hi-icon{width:20px;height:20px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.history-item .hi-text{flex:1;line-height:1.4}
.history-item .hi-date{color:var(--muted);white-space:nowrap;flex-shrink:0}
/* Note edit modal improvements */
.note-item-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:4px}
.note-item-row .note-date-badge{font-size:9px;color:var(--muted);background:var(--off);padding:2px 6px;border-radius:4px}
.noteGroup .note-date-badge{font-size:9px;font-weight:600;white-space:nowrap;pointer-events:none;margin-top:3px}

/* Milestone on chart - tooltip + click */
.milestoneWrap{cursor:pointer;z-index:12}
.milestoneWrap:hover .milestoneDiamond{filter:brightness(1.2);transform:rotate(45deg) scale(1.15)}
/* Group date range label */
.group-date-range{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}
/* Tab context menu reuse ctxMenu */
/* Subprojects panel */
.subprojects-panel{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:10px;min-width:260px;max-height:400px;overflow-y:auto}
.subprojects-panel .sp-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;margin-bottom:4px;font-size:12px}
.subprojects-panel .sp-item .sp-actions{display:flex;gap:4px}
/* Status submenu */
.ctxMenu .ctx-sub{position:relative}
.ctxMenu .ctx-submenu{position:absolute;left:100%;top:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow);min-width:160px;z-index:260}
/* completedDate field */
.completed-date-row{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
</style></head><body>
<div class="app" id="appRoot">
<div class="top">
<div class="logo">Пульс Проекта</div><div class="mut" style="margin-left:6px">© Alexander Yurasov</div><div class="sp"></div>
<button class="btn" onclick="openStatsModal()">Статистика</button>
<button class="btn" onclick="openSystemModal('assignees')">Исполнители</button>
<button class="btn" onclick="openProjectsModal()">История</button>
<button class="btn" onclick="openSystemModal('chart')">Настройки графика</button>
<button class="btn" onclick="undoLastAction()">↩ Отмена</button>
<button class="btn p" onclick="saveProject()">Сохранить</button>
<div style="position:relative"><button class="btn" onclick="showExportMenu(this)">Экспорт ▾</button></div>
<button class="btn" onclick="openFileViaFSA()">Импорт</button>
</div>

<script>
const COLORS=[['blue','#3b82f6','#fff'],['teal','#14b8a6','#fff'],['green','#22c55e','#fff'],['orange','#f97316','#fff'],['red','#ef4444','#fff'],['purple','#8b5cf6','#fff'],['amber','#f59e0b','#111'],['pink','#ec4899','#fff'],['slate','#64748b','#fff'],['indigo','#6366f1','#fff'],['cyan','#06b6d4','#fff'],['lime','#84cc16','#111']].map(([k,c,t])=>({k,c,t}));
const COLOR_MAP=new Map(COLORS.map(c=>[c.k,c]));
const ZOOM_STEPS=[0.05,0.08,0.10,0.15,0.20,0.25,0.33,0.5,0.67,0.75,1,1.25,1.5,2,2.5,3,4,5,6];
const HOLIDAYS=new Set(['2026-01-01','2026-01-02','2026-01-03','2026-01-04','2026-01-05','2026-01-06','2026-01-07','2026-01-08','2026-01-09','2026-01-10','2026-01-11','2026-02-23','2026-03-09','2026-05-01','2026-05-11','2026-06-12','2026-11-04','2026-12-31']);

const TASK_STATUSES=[{k:'new',label:'Новая',color:'var(--primary)',cls:'status-new'},{k:'inwork',label:'В работе',color:'#f59e0b',cls:'status-inwork'},{k:'blocked',label:'Заблокирована',color:'var(--danger)',cls:'status-blocked'},{k:'done',label:'Завершена',color:'#22c55e',cls:'status-done'}];
const STATUS_MAP=new Map(TASK_STATUSES.map(s=>[s.k,s]));
function statusObj(k){return STATUS_MAP.get(k)||TASK_STATUSES[0]}
function migrateRows(rows){if(!rows)return[];rows.forEach(r=>{if(r.type==='task'&&!r.status)r.status='new';if(r.type==='task'&&!r.comments)r.comments=[];if(r.type==='task'&&!r.changeHistory)r.changeHistory=[];if(r.type==='task'&&r.depLag===undefined)r.depLag=0});return rows}
function currentUser(){return __serverMode?(window.__serverUserName||'Автор'):'Автор'}
function logChange(row,action,details){if(!row.changeHistory)row.changeHistory=[];row.changeHistory.push({date:new Date().toLocaleString('ru-RU'),user:currentUser(),action,details:details||''})}
const CATEGORIES=['согласование','разработка','разработка документации','отработка замечаний','тестирование','подписание','ожидание оплаты','оплата','процессы заказчика'];


function todayDate(){return (state.today&&state.today.auto===false)?state.today.date:new Date().toISOString().slice(0,10)}
function defaultState(){return{project:{id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),title:'Новый проект',subtitle:''},range:{start:'2026-04-01',end:'2026-12-31'},today:{date:new Date().toISOString().slice(0,10),style:'dashed',color:'red',auto:true},settings:{useRuCalendar:true,showWeekends:true,showHolidays:true,showProgress:true,showNotes:true,autoShift:true,legendEnabled:false,legendPosition:'bottom',legendMode:'all',showTaskNamesOnBars:false,tooltipFields:['status','dates','progress','dependency','assignee','lastChange']},scale:'day',zoom:1,rowHeight:44,leftWidth:450,sidebarHidden:false,ganttLeftWidth:220,assignees:[{id:'a1',name:'Исполнитель 1',role:'Роль',color:'#2563eb'}],rows:[],notes:[],history:[],collapsed:{},nextId:1}}
let state=defaultState();
let openTabs=[],activeTabId=null;
var __serverTabStore={}; /* in-memory tab data for server mode: { tabId: stateJSON } */
let addTab_='task',editingId=null,pxPerDay=22,selectedColors={task:'blue',milestone:'teal',note:'orange',group:'slate',editTask:'blue'},dragState=null,renderRows=[];
let lastDirHandle=null;
let collapsedSections={};

const g=id=>document.getElementById(id),pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)},fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},diffDays=(a,b)=>Math.round((pd(b)-pd(a))/86400000),fru=s=>pd(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}).replace('.',''),monthLabel=(y,m)=>new Date(y,m,1).toLocaleDateString('ru-RU',{month:'short',year:'2-digit'}).replace('.',' '),colorObj=k=>COLOR_MAP.get(k)||COLORS[0],esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),gid=()=>'r'+(state.nextId++);
function toast(m){const t=g('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._x);t._x=setTimeout(()=>t.style.opacity='0',1800)}
function isWeekend(ds){const wd=pd(ds).getDay();return wd===0||wd===6}
function isHoliday(ds){return HOLIDAYS.has(ds)}
function isWorkingDay(ds){return state.settings.useRuCalendar?(!isWeekend(ds)&&!isHoliday(ds)):![0,6].includes(pd(ds).getDay())}
function addWorkingDays(s,n){let d=pd(s),r=Math.max(1,+n||1),f=true;while(r>0){if(f){if(isWorkingDay(fd(d)))r--;f=false}else{d=addDays(d,1);if(isWorkingDay(fd(d)))r--}}return fd(d)}
function addCalendarDays(s,n){return fd(addDays(pd(s),Math.max(0,(+n||1)-1)))}
function resolveEnd(s,mode,endDate,dur,durType){return mode==='date'?endDate:(durType==='working'?addWorkingDays(s,dur):addCalendarDays(s,dur))}
function countWorkingDays(startDate,endDate){let count=0;let d=pd(startDate);const e=pd(endDate);while(d<=e){if(isWorkingDay(fd(d)))count++;d=addDays(d,1)}return Math.max(1,count)}

function snapshot(label){const snap=JSON.parse(JSON.stringify({project:state.project,range:state.range,today:state.today,settings:state.settings,scale:state.scale,zoom:state.zoom,rowHeight:state.rowHeight,leftWidth:state.leftWidth,sidebarHidden:state.sidebarHidden,ganttLeftWidth:state.ganttLeftWidth,assignees:state.assignees,rows:state.rows,notes:state.notes,collapsed:state.collapsed,nextId:state.nextId}));state.history=state.history||[];state.history.unshift({id:'h'+Date.now()+Math.random(),label,createdAt:new Date().toLocaleString('ru-RU'),data:snap});state.history=state.history.slice(0,200);if(db&&state.project.id)dbSaveVersions(state.project.id,state.history)}
async function undoLastAction(){state.history=state.project.id?await dbGetVersions(state.project.id):state.history||[];if(!state.history||state.history.length<2){toast('Нет действия для отмены');return}state.history.shift();const prev=state.history[0];const kw=state.leftWidth,kh=state.sidebarHidden;Object.assign(state,JSON.parse(JSON.stringify(prev.data)));state.leftWidth=kw;state.sidebarHidden=kh;if(db&&state.project.id)await dbSaveVersions(state.project.id,state.history);hydrateUI();render();toast('Отменено')}

function toggleTheme(){const isDark=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',isDark?'light':'dark');g('themeToggle').textContent=isDark?'🌙':'☀️'}
function syncProjectMeta(){state.project.title=g('pTitle').value||'Новый проект';state.project.subtitle=g('pSub').value||'';g('gTitle').textContent=state.project.title;g('gSubtitle').textContent=state.project.subtitle;updateTabTitle();__notifyParent()}

/* Section collapse */
function toggleSection(id){const sec=g(id);if(!sec)return;const body=sec.querySelector('.sectionBody');const icon=sec.querySelector('.collapseIcon');collapsedSections[id]=!collapsedSections[id];if(collapsedSections[id]){body.style.display='none';icon.textContent='▸'}else{body.style.display='';icon.textContent='▾'}}

function showExportMenu(anchor){closeAllDropdowns();const m=document.createElement('div');m.className='dropMenu';m.id='_dropMenu';const r=anchor.getBoundingClientRect();m.style.left=r.left+'px';m.style.top=(r.bottom+4)+'px';m.innerHTML='<button class="btn" onclick="exportImage();closeAllDropdowns()">📷 Экспорт в PNG</button><button class="btn" onclick="exportPDF();closeAllDropdowns()">📄 Экспорт в PDF</button>';document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',function h(){closeAllDropdowns();document.removeEventListener('click',h)},{once:true}),50)}
function closeAllDropdowns(){document.querySelectorAll('.dropMenu,#newTabMenu').forEach(e=>e.remove())}

/* Tabs with dblclick rename */
var closedTabs=[];
function renderTabs(){const bar=g('tabBar');bar.innerHTML='';openTabs.forEach(t=>{const el=document.createElement('button');el.className='tab'+(t.id===activeTabId?' active':'');const span=document.createElement('span');span.textContent=t.title||'Новый проект';span.ondblclick=(e)=>{e.stopPropagation();renameTab(t.id)};el.appendChild(span);
el.oncontextmenu=(e)=>{e.preventDefault();e.stopPropagation();showTabContextMenu(e,t.id)};
if(openTabs.length>1&&!window.__ganttReadOnlyRole){const cl=document.createElement('span');cl.className='tabClose';cl.textContent='×';cl.onclick=(e)=>{e.stopPropagation();archiveTab(t.id)};el.appendChild(cl)}
el.onclick=()=>switchTab(t.id);bar.appendChild(el)});
const addBtn=document.createElement('button');addBtn.className='tabAdd';addBtn.title='Версии';addBtn.textContent='+';addBtn.onclick=(e)=>{e.stopPropagation();showTabPlusMenu(addBtn)};bar.appendChild(addBtn);
const spBtn=document.createElement('button');spBtn.className='tabAdd';spBtn.title='Подпроекты';spBtn.textContent='📂';spBtn.style.fontSize='14px';spBtn.onclick=(e)=>{e.stopPropagation();showSubprojectsPanel(spBtn)};bar.appendChild(spBtn)}

function showTabContextMenu(ev,tabId){closeContextMenu();closeAllDropdowns();
const m=document.createElement('div');m.className='ctxMenu';_ctxMenu=m;
const tab=openTabs.find(t=>t.id===tabId);
let items='';
items+='<button class="ctx-item" onclick="switchTab(\''+tabId+'\');closeContextMenu()"><span class="ctx-icon">📂</span>Открыть</button>';
items+='<button class="ctx-item" onclick="closeContextMenu();duplicateSpecificTab(\''+tabId+'\')"><span class="ctx-icon">📑</span>Дублировать</button>';
if(openTabs.length>1){items+='<div class="ctx-sep"></div>';items+='<button class="ctx-item" style="color:var(--danger)" onclick="closeContextMenu();archiveTab(\''+tabId+'\')"><span class="ctx-icon">📦</span>Закрыть</button>'}
m.innerHTML=items;
let x=ev.clientX,y=ev.clientY;document.body.appendChild(m);
if(x+m.offsetWidth>window.innerWidth)x=window.innerWidth-m.offsetWidth-8;
m.style.left=x+'px';m.style.top=y+'px';
setTimeout(()=>document.addEventListener('click',function h(){closeContextMenu();document.removeEventListener('click',h)},{once:true}),50)}

function showTabPlusMenu(anchor){closeContextMenu();closeAllDropdowns();
const m=document.createElement('div');m.className='ctxMenu';_ctxMenu=m;
const r=anchor.getBoundingClientRect();
let items='';
items+='<button class="ctx-item" onclick="closeContextMenu();createNewProject()"><span class="ctx-icon">＋</span>Создать новый</button>';
items+='<button class="ctx-item" onclick="closeContextMenu();duplicateProject()"><span class="ctx-icon">📑</span>Дублировать текущий</button>';
items+='<button class="ctx-item" onclick="closeContextMenu();importJsonToTab()"><span class="ctx-icon">📥</span>Импорт из JSON</button>';
if(closedTabs.length){items+='<div class="ctx-sep"></div>';closedTabs.forEach((ct,i)=>{items+='<button class="ctx-item" onclick="closeContextMenu();reopenClosedTab('+i+')"><span class="ctx-icon">📂</span>Открыть: '+esc(ct.title)+'</button>'})}
m.innerHTML=items;
m.style.left=r.left+'px';m.style.top=(r.bottom+4)+'px';document.body.appendChild(m);
setTimeout(()=>document.addEventListener('click',function h(){closeContextMenu();document.removeEventListener('click',h)},{once:true}),50)}

function showSubprojectsPanel(anchor){const existing=document.querySelector('.subprojects-panel');if(existing){existing.remove();return}
const panel=document.createElement('div');panel.className='subprojects-panel';
const r=anchor.getBoundingClientRect();panel.style.left=r.left+'px';panel.style.top=(r.bottom+4)+'px';
let html='<div style="font-weight:700;font-size:13px;margin-bottom:8px">Закрытые версии</div>';
if(!closedTabs.length){html+='<div class="mut" style="font-size:12px;padding:8px">Нет закрытых версий</div>'}
closedTabs.forEach((ct,i)=>{html+='<div class="sp-item"><span>'+esc(ct.title)+'</span><div class="sp-actions"><button class="btn" style="font-size:10px;padding:2px 6px" onclick="reopenClosedTab('+i+');document.querySelector(\'.subprojects-panel\')?.remove()">Открыть</button><button class="btn" style="font-size:10px;padding:2px 6px;color:var(--danger)" onclick="deleteClosedTab('+i+');document.querySelector(\'.subprojects-panel\')?.remove()">Удалить</button></div></div>'});
panel.innerHTML=html;document.body.appendChild(panel);
setTimeout(()=>document.addEventListener('click',function h(e){if(!panel.contains(e.target)){panel.remove();document.removeEventListener('click',h)}},{once:true}),50)}

function applyTabSettings(){
  var id=g('systemBody').dataset.editTabId;

  if(!tab){closeSystemModal();return}
  var title=g('dlgTitle').value.trim();
  var sub=g('dlgSub').value.trim();
  var start=g('dlgStart').value;
  var end=g('dlgEnd').value;
  if(!title)return;
  tab.title=title;
  if(__serverMode){
    var raw=__serverTabStore[id];
    var parsed;
    if(raw){parsed=JSON.parse(raw)}else{parsed={...defaultState(),project:{...defaultState().project,id:id},history:[]}}
    parsed.project.title=title;
    parsed.project.subtitle=sub;
    if(start)parsed.range.start=start;
    if(end)parsed.range.end=end;
    __serverTabStore[id]=JSON.stringify(parsed);
  }
  if(id===activeTabId){
    state.project.title=title;
    state.project.subtitle=sub;
    if(start)state.range.start=start;
    if(end)state.range.end=end;
    g('pTitle').value=title;
    g('pSub').value=sub;
    g('rangeStart').value=start;
    g('rangeEnd').value=end;
    g('gTitle').textContent=title;
    g('gSubtitle').textContent=sub;
    renderTabs();render();
  }else{
    renderTabs();__notifyParent();
  }
  closeSystemModal();

}

/* Dependency constraints */
function depRefs(pre){return pre==='t'?{parent:g('tParent'),dep:g('tDependency'),type:g('tDepType'),start:g('tStart'),end:g('tEnd'),mode:g('tEndMode'),dur:g('tDuration'),durType:g('tDurationType'),box:g('depPreview')}:{parent:g('e_parent'),dep:g('eDependency'),type:g('eDepType'),start:g('e_start'),end:g('e_end'),mode:g('e_endMode'),dur:g('e_duration'),durType:g('e_durationType'),box:g('e_depPreview')}}
function refreshTaskConstraints(pre){const e=depRefs(pre);if(!e||!e.start)return;const pS=e.start.value,pE=e.end?e.end.value:'';e.start.removeAttribute('min');e.start.removeAttribute('max');if(e.end){e.end.removeAttribute('min');e.end.removeAttribute('max')}let minS='',maxS='',minE='',maxE='';let hints=[];const parent=getTask(e.parent?.value);if(parent){minS=parent.start;maxS=parent.end;minE=parent.start;maxE=parent.end;hints.push('В пределах: '+fru(parent.start)+'–'+fru(parent.end))}
const dep=getTask(e.dep?.value)||state.rows.find(r=>r.id===e.dep?.value&&r.type==='milestone');if(dep){const ds=dep.type==='task'?shiftedStart(dep):dep.date,de=dep.type==='task'?shiftedEnd(dep):dep.date,tp=e.type.value;if(tp==='FS'){minS=chooseMax(minS,fd(addDays(pd(de),1)));hints.push('Старт ≥ '+fru(fd(addDays(pd(de),1))))}if(tp==='SS'){minS=chooseMax(minS,ds);hints.push('Старт ≥ '+fru(ds))}if(tp==='FF'){minE=chooseMax(minE,de);hints.push('Конец ≥ '+fru(de))}if(tp==='SF'){minE=chooseMax(minE,ds);hints.push('Конец ≥ '+fru(ds))}}

if(pS){let ns=pS;if(minS&&ns<minS)ns=minS;if(maxS&&ns>maxS)ns=maxS;e.start.value=ns}else if(minS)e.start.value=minS;
if(e.mode.value==='date'&&e.end){let ne=pE;if(ne){if(minE&&ne<minE)ne=minE;if(maxE&&ne>maxE)ne=maxE}else if(minE)ne=minE;if(ne)e.end.value=ne}
e.box.textContent=hints.join(' · ')}

/* Time offset helpers — shifted dates used for dependencies & rendering
   offset>0 = просрочка: задача удлиняется вправо (красный хвост)
   offset<0 = ранняя сдача: задача укорачивается справа (зелёная пометка), связь по уменьшенной дате */
function shiftedStart(r){if(!r||r.type!=='task')return r?.start||r?.date||'';return r.start}
function shiftedEnd(r){if(!r||r.type!=='task')return r?.end||r?.date||'';const off=+(r.offset||0);return fd(addDays(pd(r.end),off))}

/* Dependencies auto-shift — uses shifted dates */
function applyDependencies(){if(!state.settings.autoShift)return;for(let loop=0;loop<30;loop++){let ch=false;state.rows.forEach(r=>{if(r.type!=='task'||!r.dependencyId)return;const dep=getTask(r.dependencyId)||state.rows.find(x=>x.id===r.dependencyId&&x.type==='milestone');if(!dep)return;const ds=dep.type==='task'?shiftedStart(dep):dep.date,de=dep.type==='task'?(dep.status==='done'&&dep.completedDate?dep.completedDate:shiftedEnd(dep)):dep.date;const dur=Math.max(1,diffDays(r.start,r.end)+1);const lag=+(r.depLag||0);let ns=r.start,ne=r.end;if(r.dependencyType==='FS')ns=fd(addDays(pd(de),1+lag));if(r.dependencyType==='SS')ns=fd(addDays(pd(ds),lag));if(r.dependencyType==='FF'){ne=fd(addDays(pd(de),lag));ns=fd(addDays(pd(ne),-(dur-1)))}if(r.dependencyType==='SF'){ne=fd(addDays(pd(ds),lag));ns=fd(addDays(pd(ne),-(dur-1)))}if(r.parentId){const p=getTask(r.parentId);if(p){if(ns<p.start)ns=p.start;if(ne>p.end)ne=p.end}}const end2=r.dependencyType==='FF'||r.dependencyType==='SF'?ne:fd(addDays(pd(ns),dur-1));if(ns!==r.start||end2!==r.end){r.start=ns;r.end=end2;ch=true}});if(!ch)break}}

/* Visible rows */
let _searchTimer=null;
function onTaskSearch(){clearTimeout(_searchTimer);_searchTimer=setTimeout(()=>render(),120)}
function visibleRows(){const all=state.rows.slice();const catFilter=g('categoryFilter')?.value||'';
const search=(g('taskSearch')?.value||'').trim().toLowerCase();
let searchVisible=null;
if(search){searchVisible=new Set();all.forEach(r=>{if(r.name&&r.name.toLowerCase().includes(search))searchVisible.add(r.id)});let changed=true;while(changed){changed=false;all.forEach(r=>{if(searchVisible.has(r.id)){if(r.parentId&&!searchVisible.has(r.parentId)){searchVisible.add(r.parentId);changed=true}if(r.groupId&&!searchVisible.has(r.groupId)){searchVisible.add(r.groupId);changed=true}}})}}
const roots=all.filter(r=>!r.parentId&&!r.groupId);const out=[];
const walk=(row,depth)=>{
if(catFilter&&row.type==='task'&&row.category!==catFilter)return;
if(catFilter&&row.type==='group'){const hasMatch=all.some(c=>(c.groupId===row.id||c.parentId===row.id)&&c.type==='task'&&c.category===catFilter);if(!hasMatch)return}
if(searchVisible&&!searchVisible.has(row.id))return;
out.push({...row,depth});
const childs=all.filter(c=>(c.parentId===row.id||c.groupId===row.id)&&c.id!==row.id);
if(childs.length&&(!state.collapsed[row.id]||search)){childs.sort((a,b)=>{const ta=a.type==='group'?0:a.type==='task'?1:2;const tb=b.type==='group'?0:b.type==='task'?1:2;return ta-tb||(state.rows.indexOf(a)-state.rows.indexOf(b))});childs.forEach(c=>walk(c,depth+1))}};
roots.forEach(r=>walk(r,0));return out}

/* Main render */
function render(){syncProjectMeta();state.range.start=g('rangeStart').value||state.range.start;state.range.end=g('rangeEnd').value||state.range.end;migrateRows(state.rows);applyDependencies();refreshSelectors();renderRowList();renderLegend();
document.documentElement.style.setProperty('--side-width',(state.leftWidth||450)+'px');
g('appRoot').classList.toggle('side-hidden',!!state.sidebarHidden);
updateSideToggleIcon();
const BASE={day:26,week:16,month:22,quarter:20};pxPerDay=Math.max(2,Math.round((BASE[state.scale]||22)*state.zoom));g('zoomInput').value=Math.round(state.zoom*100)+'%';
const start=state.range.start,end=state.range.end,total=Math.max(1,diffDays(start,end)+1);
const glw=state.ganttLeftWidth||220;
const rows=renderRows=visibleRows();let cols=[];
if(state.scale==='day'){let d=pd(start);while(fd(d)<=end){const ds=fd(d);cols.push({date:ds,px:pxPerDay,weekend:isWeekend(ds),holiday:isHoliday(ds),label1:String(d.getDate()).padStart(2,'0'),label2:['вс','пн','вт','ср','чт','пт','сб'][d.getDay()]});d=addDays(d,1)}}

/* Task bar drag — duration counts working/calendar days based on durationType */
function startTaskDrag(ev,id,mode){if(window.__ganttReadOnly)return;ev.stopPropagation();ev.preventDefault();const row=getTask(id);if(!row)return;dragState={id,mode,startX:ev.clientX,origStart:row.start,origEnd:row.end,ctrl:ev.ctrlKey};window.addEventListener('mousemove',onDrag);window.addEventListener('mouseup',endDrag)}
function onDrag(ev){if(!dragState)return;const delta=Math.round((ev.clientX-dragState.startX)/pxPerDay);if(!delta)return;const row=getTask(dragState.id);if(dragState.ctrl&&dragState.mode==='move'&&!dragState.dup){dragState.dup=true;const cl=JSON.parse(JSON.stringify(row));cl.id=gid();cl.name=row.name+' (копия)';cl.dependencyId='';state.rows.push(cl);dragState.id=cl.id;dragState.origStart=cl.start;dragState.origEnd=cl.end}
const tgt=getTask(dragState.id);
if(dragState.mode==='move'){tgt.start=fd(addDays(pd(dragState.origStart),delta));tgt.end=fd(addDays(pd(dragState.origEnd),delta))}
if(dragState.mode==='resize-left'){let ns=fd(addDays(pd(dragState.origStart),delta));if(ns>tgt.end)ns=tgt.end;tgt.start=ns}
if(dragState.mode==='resize-right'){let ne=fd(addDays(pd(dragState.origEnd),delta));if(ne<tgt.start)ne=tgt.start;tgt.end=ne}
if(tgt.parentId){const p=getTask(tgt.parentId);if(p){if(tgt.start<p.start){const sh=diffDays(tgt.start,p.start);tgt.start=p.start;tgt.end=fd(addDays(pd(tgt.end),sh))}if(tgt.end>p.end)tgt.end=p.end}}
/* Sync duration — count working or calendar days */
if((tgt.durationType||'calendar')==='working'){tgt.duration=countWorkingDays(tgt.start,tgt.end)}else{tgt.duration=Math.max(1,diffDays(tgt.start,tgt.end)+1)}
render()}
function endDrag(){if(dragState)snapshot('Сдвиг');dragState=null;window.removeEventListener('mousemove',onDrag);window.removeEventListener('mouseup',endDrag)}

/* Row drag */
let draggedRowId=null;
var _dropPos=null; // {targetId, position: 'above'|'below'|'into'}
function onRowDragStart(ev,id){if(window.__ganttReadOnly){ev.preventDefault();return}draggedRowId=id;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id);requestAnimationFrame(()=>{const el=ev.target.closest&&ev.target.closest('.rowLine');if(el)el.style.opacity='0.4'})}
function onRowDragOver(ev,targetId){ev.preventDefault();ev.dataTransfer.dropEffect='move';if(!draggedRowId||draggedRowId===targetId)return;
const el=ev.currentTarget;const rect=el.getBoundingClientRect();const y=ev.clientY-rect.top;const h=rect.height;const tgt=state.rows.find(r=>r.id===targetId);
let pos='below';
if(tgt&&tgt.type==='group'){if(y<h*0.25)pos='above';else if(y>h*0.75)pos='below';else pos='into'}
else{pos=y<h/2?'above':'below'}
clearDropIndicators();el.classList.add(pos==='above'?'drag-above':pos==='into'?'drag-into':'drag-below');
_dropPos={targetId,position:pos}}
function onRowDragLeave(ev){const el=ev.currentTarget;el.classList.remove('drag-above','drag-below','drag-into','rowDropTarget')}
function clearDropIndicators(){document.querySelectorAll('.drag-above,.drag-below,.drag-into,.rowDropTarget').forEach(el=>el.classList.remove('drag-above','drag-below','drag-into','rowDropTarget'))}
function onRowDrop(ev,targetId){ev.preventDefault();clearDropIndicators();if(!draggedRowId||draggedRowId===targetId){draggedRowId=null;_dropPos=null;return}
const src=state.rows.find(r=>r.id===draggedRowId);const tgt=state.rows.find(r=>r.id===targetId);if(!src||!tgt){draggedRowId=null;_dropPos=null;return}
const pos=_dropPos&&_dropPos.targetId===targetId?_dropPos.position:'below';
snapshot('Перемещение');
const srcIdx=state.rows.indexOf(src);state.rows.splice(srcIdx,1);
const tgtIdx=state.rows.indexOf(tgt);
if(pos==='into'&&tgt.type==='group'){src.groupId=tgt.id;src.parentId='';let lastIdx=tgtIdx;for(let i=tgtIdx+1;i<state.rows.length;i++){if(state.rows[i].groupId===tgt.id||state.rows[i].parentId===tgt.id)lastIdx=i;else break}state.rows.splice(lastIdx+1,0,src);toast('Добавлено в «'+tgt.name+'»')}
else if(pos==='above'){state.rows.splice(tgtIdx,0,src);if(tgt.groupId&&src.type==='task')src.groupId=tgt.groupId}
else{state.rows.splice(tgtIdx+1,0,src);if(tgt.groupId&&src.type==='task')src.groupId=tgt.groupId}
render();draggedRowId=null;_dropPos=null}
function onRowDragEnd(ev){clearDropIndicators();const el=ev.target.closest&&ev.target.closest('.rowLine');if(el)el.style.opacity='';draggedRowId=null;_dropPos=null}

function openStatsModal(){
const tasks=state.rows.filter(r=>r.type==='task');
const groups=state.rows.filter(r=>r.type==='group');

const total=tasks.length;
const byStatus={new:0,inwork:0,blocked:0,done:0};
tasks.forEach(t=>{byStatus[t.status||'new']++});
/* offset stats */
const withOffset=tasks.filter(t=>+(t.offset||0)!==0);
const offsets=withOffset.map(t=>+(t.offset||0));
const avgOff=offsets.length?Math.round(offsets.reduce((a,b)=>a+b,0)/offsets.length*10)/10:0;
const maxOff=offsets.length?Math.max(...offsets):0;
const minOff=offsets.length?Math.min(...offsets):0;
const posOff=offsets.filter(o=>o>0);
const negOff=offsets.filter(o=>o<0);
const avgPosOff=posOff.length?Math.round(posOff.reduce((a,b)=>a+b,0)/posOff.length*10)/10:0;
const avgNegOff=negOff.length?Math.round(negOff.reduce((a,b)=>a+b,0)/negOff.length*10)/10:0;
/* date change history */
let dateChanges=0;tasks.forEach(t=>{if(t.changeHistory)t.changeHistory.forEach(h=>{if(h.action&&(h.action.includes('дат')||h.action.includes('срок')||h.action.includes('Начало')||h.action.includes('Окончание')))dateChanges++})});
/* duration stats */
const durations=tasks.map(t=>diffDays(t.start,t.end)+1);
const avgDur=durations.length?Math.round(durations.reduce((a,b)=>a+b,0)/durations.length*10)/10:0;
const totalDur=durations.reduce((a,b)=>a+b,0);
/* progress */
const avgProgress=total?Math.round(tasks.reduce((a,t)=>a+(t.progress||0),0)/total):0;
/* assignee stats */
const byAssignee=new Map();tasks.forEach(t=>{const nm=t.assigneeId?assigneeName(t.assigneeId):'Не назначен';byAssignee.set(nm,(byAssignee.get(nm)||0)+1)});
/* group stats */
const groupStats=groups.map(gr=>{const ch=tasks.filter(t=>t.groupId===gr.id||t.parentId===gr.id);const gDone=ch.filter(t=>t.status==='done').length;const gProg=ch.length?Math.round(ch.reduce((a,t)=>a+(t.progress||0),0)/ch.length):0;return{name:gr.name,count:ch.length,done:gDone,progress:gProg}});
/* overdue: tasks with positive offset */
const overdueTasks=tasks.filter(t=>+(t.offset||0)>0).sort((a,b)=>+(b.offset||0)-+(a.offset||0)).slice(0,10);
/* Build HTML */
let html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">';
html+='<div style="background:var(--surface2);border-radius:8px;padding:12px"><div class="mut" style="font-size:10px;margin-bottom:2px">Всего задач</div><div style="font-size:22px;font-weight:800">'+total+'</div></div>';
html+='<div style="background:var(--surface2);border-radius:8px;padding:12px"><div class="mut" style="font-size:10px;margin-bottom:2px">Средний прогресс</div><div style="font-size:22px;font-weight:800">'+avgProgress+'%</div></div>';
html+='<div style="background:var(--surface2);border-radius:8px;padding:12px"><div class="mut" style="font-size:10px;margin-bottom:2px">Групп / Вех</div><div style="font-size:22px;font-weight:800">'+groups.length+' / '+milestones.length+'</div></div>';
html+='<div style="background:var(--surface2);border-radius:8px;padding:12px"><div class="mut" style="font-size:10px;margin-bottom:2px">Средняя длительность</div><div style="font-size:22px;font-weight:800">'+avgDur+' дн.</div></div>';
html+='</div>';
/* Statuses */
html+='<div class="section"><h3><span>Статусы задач</span></h3><div class="pad">';
const stBar=total?'<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px">'+
(byStatus.done?'<div style="width:'+Math.round(byStatus.done/total*100)+'%;background:#22c55e" title="Завершено: '+byStatus.done+'"></div>':'')+
(byStatus.inwork?'<div style="width:'+Math.round(byStatus.inwork/total*100)+'%;background:#3b82f6" title="В работе: '+byStatus.inwork+'"></div>':'')+
(byStatus.blocked?'<div style="width:'+Math.round(byStatus.blocked/total*100)+'%;background:#ef4444" title="Заблокировано: '+byStatus.blocked+'"></div>':'')+
(byStatus.new?'<div style="width:'+Math.round(byStatus.new/total*100)+'%;background:#94a3b8" title="Новые: '+byStatus.new+'"></div>':'')+
'</div>':'';
html+=stBar;
html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
html+='<div><span style="color:#94a3b8">●</span> Новые: <b>'+byStatus.new+'</b></div>';
html+='<div><span style="color:#3b82f6">●</span> В работе: <b>'+byStatus.inwork+'</b></div>';
html+='<div><span style="color:#ef4444">●</span> Заблокировано: <b>'+byStatus.blocked+'</b></div>';
html+='<div><span style="color:#22c55e">●</span> Завершено: <b>'+byStatus.done+'</b></div>';
html+='</div></div></div>';
/* Offsets */
html+='<div class="section"><h3><span>Сдвиги сроков</span></h3><div class="pad">';
html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">';
html+='<div>Задач со сдвигом: <b>'+withOffset.length+'</b> из '+total+'</div>';
html+='<div>Изменений дат в истории: <b>'+dateChanges+'</b></div>';
html+='<div>Среднее отклонение: <b>'+(avgOff>0?'+':'')+avgOff+' дн.</b></div>';
html+='<div>Макс. просрочка: <b>'+(maxOff>0?'+'+maxOff:maxOff)+' дн.</b></div>';
html+='<div>Ср. просрочка: <b>'+(avgPosOff>0?'+':'')+avgPosOff+' дн.</b></div>';
html+='<div>Ср. опережение: <b>'+avgNegOff+' дн.</b></div>';
html+='</div>';
if(overdueTasks.length){html+='<div class="mut" style="font-size:10px;margin-bottom:4px">Топ задач по просрочке:</div>';overdueTasks.forEach(t=>{html+='<div style="font-size:11px;padding:2px 0"><span style="color:var(--danger);font-weight:700">+'+t.offset+'д</span> '+esc(t.name)+'</div>'})}
html+='</div></div>';
/* By assignee */
if(byAssignee.size>1||(byAssignee.size===1&&!byAssignee.has('Не назначен'))){html+='<div class="section"><h3><span>По исполнителям</span></h3><div class="pad">';[...byAssignee].sort((a,b)=>b[1]-a[1]).forEach(([nm,cnt])=>{const pct=Math.round(cnt/total*100);html+='<div style="margin-bottom:4px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>'+esc(nm)+'</span><span><b>'+cnt+'</b> ('+pct+'%)</span></div><div style="height:4px;border-radius:2px;background:var(--border);margin-top:2px"><div style="height:100%;border-radius:2px;background:var(--primary);width:'+pct+'%"></div></div></div>'});html+='</div></div>'}
/* By group */
if(groupStats.length){html+='<div class="section"><h3><span>По группам</span></h3><div class="pad">';groupStats.forEach(gs=>{html+='<div style="margin-bottom:6px;font-size:11px"><div style="display:flex;justify-content:space-between"><b>'+esc(gs.name)+'</b><span>'+gs.done+'/'+gs.count+' завершено, прогресс '+gs.progress+'%</span></div><div style="height:4px;border-radius:2px;background:var(--border);margin-top:2px"><div style="height:100%;border-radius:2px;background:#22c55e;width:'+gs.progress+'%"></div></div></div>'});html+='</div></div>'}
openSystemModalCustom('Статистика: '+esc(state.project.title),html)}

/* IndexedDB */
const DB_NAME='gantt_rf_pro_db_v3';let db=null;
function openDb(){return new Promise((ok,no)=>{const req=self['indexed'+'DB'].open(DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state',{keyPath:'key'});if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('versions'))d.createObjectStore('versions',{keyPath:'projectId'})};req.onsuccess=()=>{db=req.result;ok(db)};req.onerror=()=>no(req.error)})}
function dbTx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function dbPut(store,val){return new Promise((ok,no)=>{const r=dbTx(store,'readwrite').put(val);r.onsuccess=()=>ok(true);r.onerror=()=>no(r.error)})}
function dbGet(store,key){return new Promise((ok,no)=>{const r=dbTx(store).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbDelete(store,key){return new Promise((ok,no)=>{const r=dbTx(store,'readwrite').delete(key);r.onsuccess=()=>ok(true);r.onerror=()=>no(r.error)})}
async function dbGetAll(store){return new Promise((ok,no)=>{const out=[];const c=dbTx(store).openCursor();c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue()}else ok(out)};c.onerror=()=>no(c.error)})}
async function dbGetVersions(pid){const v=await dbGet('versions',pid);return v?.items||[]}
async function dbSaveVersions(pid,items){await dbPut('versions',{projectId:pid,items})}
async function dbSaveState(){if(__serverMode||!db)return;await dbPut('projects',{id:state.project.id,data:JSON.parse(JSON.stringify({...state,history:[]}))});if(state.project.id)await dbSaveVersions(state.project.id,state.history||[]);await saveTabsMeta()}

if(!_tooltipEl){_tooltipEl=document.createElement('div');_tooltipEl.className='gantt-tooltip';document.body.appendChild(_tooltipEl)}
const fields=state.settings.tooltipFields||['status','dates','progress','dependency','assignee','lastChange'];
let html='<div class="tt-title">'+esc(row.name)+'</div>';
fields.forEach(f=>{
if(f==='status'&&row.status){const s=statusObj(row.status);html+='<div class="tt-row"><b>Статус:</b> <span class="'+s.cls+'">'+s.label+'</span></div>'}
if(f==='dates'&&row.start){const fmtD=s=>pd(s).toLocaleDateString('ru-RU');let dh='<div class="tt-row"><b>Срок:</b> '+fmtD(row.start)+' — '+fmtD(row.end)+'</div>';const off=+(row.offset||0);if(off!==0){const se=shiftedEnd(row);dh+='<div class="tt-row"><b>Сдвинуто:</b> '+(off>0?'+':'')+off+'д (до '+fmtD(se)+')</div>'}html+=dh}
if(f==='assignee'&&row.assigneeId){html+='<div class="tt-row"><b>Ответственный:</b> '+esc(assigneeName(row.assigneeId))+'</div>'}

});

if(row.dependencyId){const dep=getTask(row.dependencyId)||state.rows.find(r=>r.id===row.dependencyId);if(dep)html+='<div class="tt-row"><b>Зависит от:</b> '+esc(dep.name)+'</div>'}
_tooltipEl.innerHTML=html;_tooltipEl.style.display='block';_tooltipEl.style.opacity='1';
moveTaskTooltip(ev)}
function moveTaskTooltip(ev){if(!_tooltipEl)return;let x=ev.clientX+12,y=ev.clientY+12;if(x+320>window.innerWidth)x=ev.clientX-320;if(y+200>window.innerHeight)y=ev.clientY-200;_tooltipEl.style.left=x+'px';_tooltipEl.style.top=y+'px'}

if(!_tooltipEl){_tooltipEl=document.createElement('div');_tooltipEl.className='gantt-tooltip';document.body.appendChild(_tooltipEl)}

html+='<div class="tt-row"><b>Сроки (с учётом сдвига):</b> '+fru(ss)+' \u2013 '+fru(se)+'</div>';

/* Context menu */

function openJira(id){const row=state.rows.find(r=>r.id===id);if(!row||!row.jiraUrl)return;window.open(row.jiraUrl,'_blank')}
function showContextMenu(ev){ev.preventDefault();if(window.__ganttReadOnly)return;closeContextMenu();closeAllDropdowns();
const bar=ev.target.closest('.barArea');if(!bar)return;
const rowId=bar.dataset.rowid||'';
const row=state.rows.find(r=>r.id===rowId);
const rect=bar.getBoundingClientRect();const relX=ev.clientX-rect.left;const dayOffset=Math.floor(relX/pxPerDay);const clickDate=fd(addDays(pd(state.range.start),dayOffset));
const m=document.createElement('div');m.className='ctxMenu';_ctxMenu=m;

function showStatusSubmenu(anchor,rowId){const existing=anchor.parentElement.querySelector('.ctx-submenu');if(existing){existing.remove();return}
const sub=document.createElement('div');sub.className='ctx-submenu';
TASK_STATUSES.forEach(s=>{const btn=document.createElement('button');btn.className='ctx-item';btn.innerHTML='<span class="status-dot st-'+s.k+'" style="display:inline-block"></span> '+s.label;btn.onclick=()=>{ctxSetStatus(rowId,s.k)};sub.appendChild(btn)});

function ctxSetStatus(rowId,status){closeContextMenu();const row=state.rows.find(r=>r.id===rowId);if(!row)return;snapshot('Статус');const old=row.status;
if(status==='done'&&old!=='done'){const compDate=prompt('Дата завершения (ГГГГ-ММ-ДД):',fd(new Date()));if(compDate){row.completedDate=compDate;const actualEnd=compDate;const diff=diffDays(row.start,actualEnd);row.offset=diff-diffDays(row.start,row.end)}}
if(status!=='done'&&old==='done'){delete row.completedDate;row.offset=0}
logChange(row,'Статус','«'+statusObj(old).label+'» → «'+statusObj(status).label+'»');row.status=status;render();toast('Статус: '+statusObj(status).label)}

function ctxDeleteRow(rowId){closeContextMenu();const row=state.rows.find(r=>r.id===rowId);if(!row)return;if(!confirm('Удалить «'+row.name+'»?'))return;snapshot('Удаление');state.rows=state.rows.filter(r=>r.id!==rowId);state.notes=state.notes.filter(n=>n.rowId!==rowId);state.rows.forEach(r=>{if(r.parentId===rowId)r.parentId='';if(r.groupId===rowId)r.groupId='';if(r.dependencyId===rowId)r.dependencyId=''});render();toast('Удалено')}

function ctxDuplicateRow(rowId){closeContextMenu();const row=state.rows.find(r=>r.id===rowId);if(!row)return;snapshot('Дублирование');const copy=JSON.parse(JSON.stringify(row));copy.id=gid();copy.name=row.name+' (копия)';copy.changeHistory=[];copy.comments=[];logChange(copy,'Создание','Дублировано из «'+row.name+'»');const idx=state.rows.indexOf(row);state.rows.splice(idx+1,0,copy);render();toast('Дублировано')}

function ctxAddNoteToTask(rowId,date){closeContextMenu();snapshot('Добавлена пометка');const text=prompt('Текст пометки:');if(!text)return;state.notes.push({id:'n'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date,text,rowId,color:selectedColors.note,showDate:false});render();toast('Пометка добавлена')}

function ctxAddChildTask(parentId,date){closeContextMenu();const name=prompt('Название дочерней задачи:');if(!name)return;snapshot('Добавлена задача');const end=fd(addDays(pd(date),4));const newRow={id:gid(),type:'task',name,start:date,end,endMode:'date',duration:5,durationType:'calendar',progress:0,offset:0,barText:'',category:'',color:selectedColors.task,parentId,groupId:'',assigneeId:'',dependencyId:'',dependencyType:'FS',depLag:0,status:'new',comments:[],changeHistory:[]};logChange(newRow,'Создание','Дочерняя задача');state.rows.push(newRow);render()}
function ctxAddNextTask(depId,date){closeContextMenu();const depRow=getTask(depId);const startDate=depRow?fd(addDays(pd(depRow.end),1)):date;const name=prompt('Название последующей задачи:');if(!name)return;snapshot('Добавлена задача');const end=fd(addDays(pd(startDate),4));const newRow={id:gid(),type:'task',name,start:startDate,end,endMode:'date',duration:5,durationType:'calendar',progress:0,offset:0,barText:'',category:'',color:selectedColors.task,parentId:'',groupId:depRow?.groupId||'',assigneeId:'',dependencyId:depId,dependencyType:'FS',depLag:0,status:'new',comments:[],changeHistory:[]};logChange(newRow,'Создание','Последующая задача после «'+depRow?.name+'»');state.rows.push(newRow);render()}
function ctxAddNewTask(date){closeContextMenu();const name=prompt('Название задачи:');if(!name)return;snapshot('Добавлена задача');const end=fd(addDays(pd(date),4));const newRow={id:gid(),type:'task',name,start:date,end,endMode:'date',duration:5,durationType:'calendar',progress:0,offset:0,barText:'',category:'',color:selectedColors.task,parentId:'',groupId:'',assigneeId:'',dependencyId:'',dependencyType:'FS',depLag:0,status:'new',comments:[],changeHistory:[]};logChange(newRow,'Создание','Задача создана');state.rows.push(newRow);render()}

/* Notes: edit + date display */

const html='<div class="col"><label class="lbl">Дата пометки</label><input id="editNoteDate" class="inp" type="date" value="'+note.date+'"><label class="lbl">Комментарий</label><textarea id="editNoteText" class="txt">'+esc(note.text)+'</textarea><label class="lbl">Цвет</label><div id="editNoteColors" class="colors"></div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="editNoteShowDate" '+(note.showDate?'checked':'')+' style="width:16px;height:16px"><label class="lbl" style="margin:0">Показывать дату</label></div><div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end"><button class="btn" onclick="closeSystemModal()">Отмена</button><button class="btn p" onclick="saveNoteEdit(\''+noteId+'\')">Сохранить</button></div></div>';
openSystemModalCustom('Редактировать пометку',html);
selectedColors._noteEdit=note.color||'orange';buildColorPicker('editNoteColors','_noteEdit')}
function saveNoteEdit(noteId){const note=state.notes.find(n=>n.id===noteId);if(!note)return;snapshot('Правка пометки');note.date=g('editNoteDate')?.value||note.date;note.text=(g('editNoteText')?.value||'').trim()||note.text;note.color=selectedColors._noteEdit||note.color;note.showDate=!!g('editNoteShowDate')?.checked;closeSystemModal();render();toast('Пометка обновлена')}

function toggleTooltipField(field){if(!state.settings.tooltipFields)state.settings.tooltipFields=['status','dates','progress','dependency','assignee','lastChange'];const idx=state.settings.tooltipFields.indexOf(field);if(idx>=0)state.settings.tooltipFields.splice(idx,1);else state.settings.tooltipFields.push(field);render()}
/* Init */
async function initApp(){await openDb();
const tabsMeta=await loadTabsMeta();const allP=await dbGetAll('projects');
if(tabsMeta?.openTabs?.length>0){openTabs=tabsMeta.openTabs;activeTabId=tabsMeta.activeTabId||openTabs[0].id;const saved=allP.find(p=>p.id===activeTabId);if(saved){state=JSON.parse(JSON.stringify(saved.data));state.history=await dbGetVersions(state.project.id)}else{state=defaultState();state.project.id=activeTabId}}

/* postMessage bridge for server integration */
var __serverMode = false;
var __readOnly = false;

function applyServerMode() {
  // Rename: Сохранить→Экспорт JSON (move into export dropdown), Открыть→Импорт JSON
  var btns = document.querySelectorAll('.top .btn');
  btns.forEach(function(b) {
    var t = b.textContent.trim();
    if (t === 'Сохранить') {
      b.style.display = 'none'; // hide standalone — moved into Экспорт menu
    }
    if (t === 'Открыть') {
      b.textContent = 'Импорт JSON';
      b.onclick = function() { openFileViaFSA(); };
    }
    // Hide "История" (projects modal) — not relevant in server mode
    if (t === 'История') {
      b.style.display = 'none';
    }
  });
  // Patch showExportMenu to include Экспорт JSON
  var origShowExport = window.showExportMenu;
  window.showExportMenu = function(anchor) {
    closeAllDropdowns();
    var m = document.createElement('div');
    m.className = 'dropMenu';
    m.id = '_dropMenu';
    var r = anchor.getBoundingClientRect();
    m.style.left = r.left + 'px';
    m.style.top = (r.bottom + 4) + 'px';
    m.innerHTML = '<button class="btn" onclick="exportImage();closeAllDropdowns()">📷 Экспорт в PNG</button>' +
      '<button class="btn" onclick="exportPDF();closeAllDropdowns()">📄 Экспорт в PDF</button>' +
      '<button class="btn" onclick="saveProject();closeAllDropdowns()">📋 Экспорт JSON</button>';
    document.body.appendChild(m);
    setTimeout(function() { document.addEventListener('click', function h() { closeAllDropdowns(); document.removeEventListener('click', h); }, { once: true }); }, 50);
  };
}

function applyReadOnly() {
  // Use the side-hidden class to properly expand the main area
  var appRoot = g('appRoot');
  if (appRoot) appRoot.classList.add('side-hidden');
  state.sidebarHidden = true;
  // Hide tab add button for viewers (can still view tabs but not create)
  window.__ganttReadOnlyRole=true;var tabAddBtns = document.querySelectorAll('.tabBar .tabAdd');
  tabAddBtns.forEach(function(b) { b.style.display = 'none'; });
  // Also hide tab close buttons
  var tabCloseBtns = document.querySelectorAll('.tabBar .tabClose');
  tabCloseBtns.forEach(function(b) { b.style.display = 'none'; });
  // Hide editing buttons from toolbar
  var btns = document.querySelectorAll('.top .btn');
  btns.forEach(function(b) {
    var t = b.textContent.trim();
    if (t === '↩ Отмена' || t === 'Импорт JSON' || t === 'Исполнители') {
      b.style.display = 'none';
    }
  });
  // Disable row double-click editing
  window.__ganttReadOnly = true;
}

/* Build full server state including all tabs */
function __buildServerBlob() {
  __serverTabStore[activeTabId] = JSON.stringify({...state, history: []});
  var tabsData = {};
  openTabs.forEach(function(t) { tabsData[t.id] = __serverTabStore[t.id] || null; });
  return JSON.stringify({ __tabs: { openTabs: openTabs, activeTabId: activeTabId, tabsData: tabsData }, ...JSON.parse(JSON.stringify({...state, history: []})) });
}
function __notifyParent(){if(__serverMode){try{window.parent.postMessage({type:'gantt-state-changed',state:__buildServerBlob()},'*')}catch(e){}}}

window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  if (e.data.type === 'load-project') {
    try {
      __serverMode = true;
      __readOnly = !!e.data.readOnly;
      
      const d = typeof e.data.data === 'string' ? JSON.parse(e.data.data) : e.data.data;
      /* Restore tabs from __tabs envelope if present */
      if (d && d.__tabs && d.__tabs.openTabs && d.__tabs.openTabs.length > 0) {
        openTabs = d.__tabs.openTabs;
        activeTabId = d.__tabs.activeTabId || openTabs[0].id;
        __serverTabStore = {};
        var td = d.__tabs.tabsData || {};
        openTabs.forEach(function(t) { if (td[t.id]) __serverTabStore[t.id] = td[t.id]; });
        /* Load active tab state */
        var activeRaw = __serverTabStore[activeTabId];
        if (activeRaw) {
          state = JSON.parse(activeRaw);
        } else {
          /* Fallback: use top-level data (without __tabs) */
          var fallback = JSON.parse(JSON.stringify(d));
          delete fallback.__tabs;
          if (fallback.project) { state = fallback; } else { state = defaultState(); }
          __serverTabStore[activeTabId] = JSON.stringify({...state, history: []});
        }
      } else if (d && d.project) {
        state = JSON.parse(JSON.stringify(d));
        delete state.__tabs;
        openTabs = [{ id: state.project.id, title: state.project.title }];
        activeTabId = state.project.id;
        __serverTabStore = {};
        __serverTabStore[activeTabId] = JSON.stringify({...state, history: []});
      } else if (d && d.rows) {
        const def = defaultState();
        Object.assign(def, d);
        delete def.__tabs;
        state = def;
        openTabs = [{ id: state.project.id, title: state.project.title }];
        activeTabId = state.project.id;
        __serverTabStore = {};
        __serverTabStore[activeTabId] = JSON.stringify({...state, history: []});
      } else {
        state = defaultState();
        openTabs = [{ id: state.project.id, title: state.project.title }];
        activeTabId = state.project.id;
        __serverTabStore = {};
        __serverTabStore[activeTabId] = JSON.stringify({...state, history: []});
      }
      // Sync active tab title to state (tab.title is source of truth)
      var atab = openTabs.find(function(t){return t.id===activeTabId});
      if(atab) state.project.title = atab.title;
      // For single-tab projects, use server project title if provided
      if (e.data.title && openTabs.length === 1 && !(d && d.__tabs && d.__tabs.openTabs && d.__tabs.openTabs.length > 0)) { state.project.title = e.data.title; openTabs[0].title = e.data.title; }
      if (e.data.userName) window.__serverUserName = e.data.userName;
      if (!state.ganttLeftWidth) state.ganttLeftWidth = 220;
      if (!state.settings) state.settings = {};
      if (state.settings.showTaskNamesOnBars === undefined) state.settings.showTaskNamesOnBars = false;
      state.history = [];
      hydrateUI(); render(); renderTabs();
      
      applyServerMode();
      if (__readOnly) applyReadOnly();
    } catch (err) { console.error('load-project error', err); }
  }
  if (e.data.type === 'request-state') {
    window.parent.postMessage({ type: 'gantt-state-response', state: __buildServerBlob() }, '*');
  }
});

/* Override render to notify parent of changes */
const _originalRender = render;
let _renderCount = 0;
render = function() {
  _originalRender();
  _renderCount++;
  if (_renderCount > 1 && __serverMode) {
    try {
      window.parent.postMessage({ type: 'gantt-state-changed', state: __buildServerBlob() }, '*');
    } catch(e) {}
  }
};
