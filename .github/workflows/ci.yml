# CI «Пульса Проекта»: сервер (ruff, pytest на SQLite и PostgreSQL, миграции, перенос
# реальной базы 1.0.1 со сверкой), клиент (eslint, vitest, сборка), e2e на Playwright
# и репетиция установки в Docker Compose (сборка образов, перенос базы, запуск, копия).
name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 'Клиент: eslint + vitest + сборка'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: 'Сервер: ruff + pytest (SQLite)'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q
      - name: Alembic — одна голова, схема совпадает с моделями, upgrade/downgrade
        env:
          FLASK_ENV: development
          SQLALCHEMY_DATABASE_URI: sqlite:////tmp/puls-ci.db
        run: |
          test "$(alembic heads | wc -l)" = "1"
          python scripts/migrate_on_start.py
          alembic check
          alembic downgrade base
          alembic upgrade head

  backend-postgres:
    name: 'Сервер: PostgreSQL — тесты, миграции, перенос базы 1.0.1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: puls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d puls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/puls_ci
        run: pytest -q
      - name: Миграции и перенос снимка базы 1.0.1 со сверкой
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/puls_ci
        run: |
          python scripts/migrate_on_start.py
          python scripts/import_legacy.py ../legacy/snapshot/puls-2026-10-30.db --report /tmp/import-report.md
          cat /tmp/import-report.md >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: 'E2E: Playwright на перенесённых данных 1.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Playwright и Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: E2E
        env:
          PYTHON: python
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: npm run e2e
      - name: Снимки экранов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: 'Docker: сборка, перенос базы 1.0.1, запуск стека, резервная копия'
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-0123456789abcdef-0123456789
      POSTGRES_PASSWORD: ci-only-password
      HTTP_PORT: '8080'
      # Пароль первого администратора задан, как при ошибке на рабочем сервере: перенос 1.0.1 он не блокирует
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
    steps:
      - uses: actions/checkout@v7
      - name: Сборка образов
        run: docker compose build
      - name: База и перенос снимка 1.0.1
        run: |
          cp legacy/snapshot/puls-2026-10-30.db import/puls.db
          docker compose up -d --wait db
          docker compose --profile migrate run --rm legacy-import
          cat import/import-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Запуск и проверка
        run: |
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:8080/api/health/ready
          curl -fsSI http://127.0.0.1:8080/ | grep -i '^content-security-policy'
          docker compose exec -T backup sh /usr/local/bin/backup.sh now ci
          docker compose exec -T backup sh /usr/local/bin/backup.sh list
      - name: Журналы контейнеров
        if: failure()
        run: docker compose logs --tail 200
